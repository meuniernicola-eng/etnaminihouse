<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EtnaMinihhouse</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #0d0d0b; color: #f7f7f7; }
    nav { background: #141412; padding: 20px; text-align: center; }
    .hero { min-height: 100vh; padding: 100px 20px; background: linear-gradient(180deg, #0d0d0b 0%, #141412 100%); display: flex; align-items: center; justify-content: center; }
    .carousel { max-width: 1000px; width: 100%; background: #1a1a18; border-radius: 10px; overflow: hidden; }
    .carousel-image { width: 100%; height: 600px; object-fit: cover; display: none; }
    .carousel-image.active { display: block; }
    .carousel-controls { padding: 20px; text-align: center; background: #141412; }
    .btn { background: #ffa500; color: #0d0d0b; border: none; padding: 10px 20px; cursor: pointer; margin: 5px; border-radius: 5px; font-weight: bold; }
    .btn:hover { background: #ffb520; }
    .booking { padding: 50px 20px; background: #141412; }
    .booking-form { max-width: 500px; margin: 0 auto; }
    input, textarea { width: 100%; padding: 10px; margin: 10px 0; background: #0a0a0a; border: 1px solid #333; color: #f7f7f7; border-radius: 5px; font-family: inherit; }
    .submit { background: #ffa500; color: #0d0d0b; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <nav><h1>🏠 EtnaMinihhouse - Maisons Modulaires de Luxe</h1></nav>
  <section class="hero">
    <div class="carousel">
      <img src="https://nestpod-naperville.netlify.app/images/models/panorama/roof-detail-skylight-1920w.webp" alt="Image 1" class="carousel-image active">
      <img src="https://nestpod-naperville.netlify.app/images/models/panorama/delivery-transport-truck-1920w.webp" alt="Image 2" class="carousel-image">
      <img src="https://nestpod-naperville.netlify.app/images/models/panorama/exterior-forest-day-1920w.webp" alt="Image 3" class="carousel-image">
      <img src="https://nestpod-naperville.netlify.app/images/models/panorama/roof-detail-skylight-1920w.webp" alt="Image 4" class="carousel-image">
      <img src="https://nestpod-naperville.netlify.app/images/models/panorama/delivery-transport-truck-1920w.webp" alt="Image 5" class="carousel-image">
      <img src="https://nestpod-naperville.netlify.app/images/models/panorama/exterior-forest-day-1920w.webp" alt="Image 6" class="carousel-image">
      <img src="https://nestpod-naperville.netlify.app/images/models/panorama/roof-detail-skylight-1920w.webp" alt="Image 7" class="carousel-image">
      <img src="https://nestpod-naperville.netlify.app/images/models/panorama/delivery-transport-truck-1920w.webp" alt="Image 8" class="carousel-image">
      <img src="https://nestpod-naperville.netlify.app/images/models/panorama/exterior-forest-day-1920w.webp" alt="Image 9" class="carousel-image">
      <div class="carousel-controls">
        <button class="btn" onclick="prevSlide()">← Précédent</button>
        <span id="counter">1 / 9</span>
        <button class="btn" onclick="nextSlide()">Suivant →</button>
      </div>
    </div>
  </section>
  
  <section class="booking">
    <h2 style="text-align: center; margin-bottom: 30px;">Réservez Votre Visite</h2>
    <form class="booking-form" onsubmit="handleBooking(event)">
      <input type="text" placeholder="Prénom" required>
      <input type="text" placeholder="Nom" required>
      <input type="email" placeholder="Email" required>
      <input type="tel" placeholder="Téléphone" required>
      <input type="date" required>
      <textarea placeholder="Message" rows="5"></textarea>
      <button type="submit" class="submit">Envoyer la Réservation</button>
    </form>
  </section>

  <script>
    let idx = 0;
    const imgs = document.querySelectorAll('.carousel-image');
    const total = imgs.length;
    
    function update() {
      imgs.forEach((img, i) => img.classList.toggle('active', i === idx));
      document.getElementById('counter').textContent = (idx + 1) + ' / ' + total;
    }
    
    function nextSlide() { idx = (idx + 1) % total; update(); }
    function prevSlide() { idx = (idx - 1 + total) % total; update(); }
    
    setInterval(nextSlide, 5000);
    
    function handleBooking(e) {
      e.preventDefault();
      alert('Réservation envoyée! Nous vous recontacterons bientôt.');
    }
  </script>
</body>
</html>
